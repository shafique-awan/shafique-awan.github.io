<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17202a">
  <title>Page Not Found | Shafique Awan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      color: #17202a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      width: min(560px, calc(100% - 32px));
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: #7b2430;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .error-code {
      margin: 0;
      font-size: clamp(72px, 18vw, 120px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 auto 28px;
      max-width: 440px;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 11px;
      background: #17202a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 750;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.88;
    }

    .footer {
      margin-top: 36px;
      color: #98a2b3;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="eyebrow">Executive Profile</div>

    <h2 class="error-code">404</h2>

    <h1>Page not found</h1>

    <p>
      The page you're looking for doesn't exist or may have moved.
      Return to Shafique Awan's executive profile.
    </p>

    <a class="button" href="/">
      ← Back to Executive Profile
    </a>

    <div class="footer">
      Shafique Awan · Associate Director
    </div>
  </main>
</body>
</html>
